<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beos Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8ebf6;--ink:#14172b;--blue:#3a4bff;--orange:#ff7a3d;--mint:#2fd3a0;--pink:#ff8fc4}
*{box-sizing:border-box;margin:0}
body{font-family:'Bricolage Grotesque',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:48px 20px 64px}
main{max-width:720px;margin:0 auto}
h1{font-size:clamp(3.2rem,16vw,7rem);font-weight:800;line-height:.9;letter-spacing:-.04em}
.sub{margin:20px 0 40px;font-size:1.15rem;max-width:30ch;opacity:.75}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{display:flex;flex-direction:column;justify-content:space-between;min-height:200px;padding:22px;border-radius:28px;color:var(--ink);text-decoration:none;transition:transform .2s,border-radius .2s}
.tile:hover,.tile:focus-visible{transform:translateY(-6px) rotate(-1deg);border-radius:40px 20px 40px 20px;outline:none}
.tile:focus-visible{box-shadow:0 0 0 4px var(--ink)}
.tile.wide{grid-column:1/-1;min-height:170px}
.icon{font-size:2.6rem}
.name{font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.desc{font-size:.95rem;opacity:.8;margin-top:4px}
.c1{background:var(--blue);color:#fff}.c2{background:var(--orange)}.c3{background:var(--mint)}
footer{margin-top:40px;font-size:.9rem;opacity:.6}
@media(max-width:480px){.grid{grid-template-columns:1fr}.tile{min-height:150px}}
@media(prefers-reduced-motion:reduce){.tile{transition:none}}
</style>
</head>
<body>
<main>
  <h1>Beos<br>Studio</h1>
  <p class="sub">Chọn một mục để xem và tải file.</p>
  <div class="grid">
    <a class="tile wide c1" href="/tentrang/download/">
      <span class="icon">📦</span>
      <span><span class="name">Tên trang</span><br><span class="desc">Bản mới nhất, tải miễn phí</span></span>
    </a>
    <a class="tile c2" href="/trang2/download/">
      <span class="icon">🎮</span>
      <span><span class="name">Trang 2</span><br><span class="desc">Mô tả ngắn</span></span>
    </a>
    <a class="tile c3" href="/trang3/download/">
      <span class="icon">🎨</span>
      <span><span class="name">Trang 3</span><br><span class="desc">Mô tả ngắn</span></span>
    </a>
  </div>
  <footer>© Beos Studio</footer>
</main>
</body>
</html>
