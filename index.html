<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beos Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8ebf6;--ink:#14172b;--blue:#3a4bff;--orange:#ff7a3d;--mint:#2fd3a0}
*{box-sizing:border-box;margin:0}
body{font-family:'Bricolage Grotesque',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:48px 20px 64px}
main{max-width:720px;margin:0 auto}
h1{font-size:clamp(3.2rem,16vw,7rem);font-weight:800;line-height:.9;letter-spacing:-.04em}
section{margin-top:48px}
h2{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.hint{opacity:.65;margin-bottom:18px}

/* Dự án: ô lớn, màu */
.projects{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{display:flex;flex-direction:column;justify-content:space-between;min-height:190px;padding:22px;border-radius:28px;color:var(--ink);text-decoration:none;transition:transform .2s,border-radius .2s}
.tile.wide{grid-column:1/-1}
.tile:hover,.tile:focus-visible{transform:translateY(-6px) rotate(-1deg);border-radius:40px 20px 40px 20px;outline:none}
.tile:focus-visible{box-shadow:0 0 0 4px var(--ink)}
.icon{font-size:2.6rem}
.name{font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.desc{font-size:.95rem;opacity:.8;margin-top:4px}
.c1{background:var(--blue);color:#fff}.c2{background:var(--orange)}.c3{background:var(--mint)}

/* Download Center: dạng hàng, nút tải bên phải */
.downloads{display:grid;gap:12px}
.dl{display:flex;align-items:center;gap:16px;padding:16px 18px;background:#fff;border-radius:22px;color:var(--ink)}
.dl .icon{font-size:2rem}
.dl .info{flex:1}
.dl .name{font-size:1.2rem}
.get{background:var(--ink);color:#fff;text-decoration:none;font-weight:800;padding:12px 20px;border-radius:999px;white-space:nowrap;transition:transform .15s}
.get:hover,.get:focus-visible{transform:scale(1.08);outline:none}
.get:focus-visible{box-shadow:0 0 0 4px var(--blue)}

footer{margin-top:48px;font-size:.9rem;opacity:.6}
@media(max-width:480px){.projects{grid-template-columns:1fr}.tile{min-height:150px}}
@media(prefers-reduced-motion:reduce){.tile,.get{transition:none}}
</style>
</head>
<body>
<main>
  <h1>Beos<br>Studio</h1>

  <section>
    <h2>Dự án</h2>
    <p class="hint">Bấm vào để mở trực tiếp.</p>
    <div class="projects">
      <!-- Đổi href thành đường dẫn trang dự án, hoặc link web ngoài (https://...) -->
      <a class="tile wide c1" href="/duan1/">
        <span class="icon">🚀</span>
        <span><span class="name">Dự án 1</span><br><span class="desc">Mô tả ngắn về dự án</span></span>
      </a>
      <a class="tile c2" href="/duan2/">
        <span class="icon">🎮</span>
        <span><span class="name">Dự án 2</span><br><span class="desc">Mô tả ngắn</span></span>
      </a>
      <a class="tile c3" href="/duan3/">
        <span class="icon">🎨</span>
        <span><span class="name">Dự án 3</span><br><span class="desc">Mô tả ngắn</span></span>
      </a>
    </div>
  </section>

  <section>
    <h2>Download Center</h2>
    <p class="hint">Bấm nút Tải về để lấy file.</p>
    <div class="downloads">
      <!-- Thay LINK-FILE-1/2/3 bằng link Mediafire thật của bạn -->
      <div class="dl">
        <span class="icon">📦</span>
        <span class="info"><span class="name">File 1</span><br><span class="desc">Phiên bản mới nhất</span></span>
        <a class="get" href="https://www.mediafire.com/LINK-FILE-1" target="_blank" rel="noopener">Tải về</a>
      </div>
      <div class="dl">
        <span class="icon">🧩</span>
        <span class="info"><span class="name">File 2</span><br><span class="desc">Mô tả ngắn</span></span>
        <a class="get" href="https://www.mediafire.com/LINK-FILE-2" target="_blank" rel="noopener">Tải về</a>
      </div>
      <div class="dl">
        <span class="icon">🛠️</span>
        <span class="info"><span class="name">File 3</span><br><span class="desc">Mô tả ngắn</span></span>
        <a class="get" href="https://www.mediafire.com/LINK-FILE-3" target="_blank" rel="noopener">Tải về</a>
      </div>
    </div>
  </section>

  <footer>© Beos Studio</footer>
</main>
</body>
</html>
